name: Diagnose GitHub OIDC claims

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    environment:
      name: oss-staging
    steps:
      - name: Print selected OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=github-actions")"
          token="$(printf '%s' "$response" | jq -r '.value')"
          payload="$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')"
          case $((${#payload} % 4)) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          claims="$(printf '%s' "$payload" | base64 --decode)"
          printf '%s' "$claims" | jq '{iss, aud, sub}'
