# Fork-only rehearsal. Build the real desktop and CLI packages, publish an unsigned
# GitHub prerelease, then optionally copy exactly those Release assets to GitCode.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing fork tag, e.g. v0.2.19-gitcode-test.20261126.1"
        type: string
        required: true
      sync_gitcode:
        description: "Mirror the GitHub prerelease to the GitCode test repository"
        type: boolean
        default: false

env:
  PENGUIN_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # Bundled Node runtime version (official nodejs.org dist, aligned with engines >=24).
  NODE_RUNTIME_VERSION: v24.18.0
  # Bundled POSIX shell for the Windows package: Git for Windows' MinGit, whose usr/bin/sh.exe
  # IS GNU bash (installed under the name `sh`), plus ~60 coreutils and git.exe. Pinned to an
  # exact release so the shipped bytes are reproducible and the GPLv2 source offer in
  # THIRD-PARTY-NOTICES.md names one version. Bump deliberately, not automatically.
  MINGIT_VERSION: 2.55.0.3
  MINGIT_TAG: v2.55.0.windows.3

jobs:
  check-release:
    if: github.repository == 'laodouuu/penguin-harness'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-gitcode-test\.[0-9]{8}\.[0-9]+$'
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # Desktop installers (Electron shell, three-OS matrix). Runs BEFORE the release job:
  # Release assets are immutable once published, so the installers must exist when the
  # Release is created.
  desktop:
    needs: [check-release]
    if: needs.check-release.outputs.exists != 'true'
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      require_macos_signing: false
      require_windows_signing: false

  release:
    needs: [check-release, desktop]
    if: needs.check-release.outputs.exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # On manual dispatch, check out the tag itself (not the selected branch HEAD): a tag whose Release is
      # missing (e.g. an earlier run failed before publishing) rebuilds from the tag's own source. On tag-push,
      # leaving ref empty is the default.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      # pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release installers
        run: sh scripts/test-installer.sh

      # Inject the release tag into core's VERSION constant (the source for CLI --version and the install-complete
      # message) and both standalone installers. The stamped installers then select the same immutable OSS/GitHub
      # release when run directly. BUILD_DATE is stamped alongside core with this run's UTC date.
      - name: Stamp release version
        env:
          # Referenced as a plain shell variable so the run block stays free of GitHub
          # expressions: scripts/test-installer.sh replays this block verbatim as sh.
          EVENT_NAME: ${{ github.event_name }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          V="${TAG#v}"
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9A-Za-z][0-9A-Za-z._-]*$'
          # Guard: release prep must bump the repo to the tag's version (root + every workspace
          # package.json — packages/* and plugins/* —
          # and core's VERSION constant move together in the release: X.Y.Z PR). v0.2.1 was tagged with
          # a 0.2.0 repo, so every dev/source build nagged about updates until the repo caught up —
          # fail the tag push instead. Manual dispatch (EVENT_NAME unset in replays) only warns,
          # keeping legacy tags rebuildable; installer-test fixtures have no package.json, so the
          # check self-skips there.
          if [ -f package.json ]; then
            PKG_V="$(node -p 'require("./package.json").version')"
            if [ "$PKG_V" != "$V" ]; then
              MSG="tag $TAG does not match the repo version $PKG_V; bump root + every workspace package.json (packages/*, plugins/*) and core VERSION during release prep, then re-tag (see .github/CONTRIBUTING.md)."
              if [ "${EVENT_NAME:-}" = "push" ]; then
                echo "error: $MSG" >&2
                exit 1
              fi
              echo "warning: $MSG (continuing: manual dispatch)" >&2
            fi
          fi
          grep -q 'export const VERSION = "' packages/core/src/index.ts
          sed -i "s/export const VERSION = \"[^\"]*\"/export const VERSION = \"$V\"/" packages/core/src/index.ts
          SH_MARKER='EMBEDDED_RELEASE_VERSION="__PENGUIN_RELEASE_VERSION__"'
          PS_MARKER='$EmbeddedReleaseVersion = "__PENGUIN_RELEASE_VERSION__"'
          if grep -Fq "$SH_MARKER" install.sh; then SH_HAS_MARKER=1; else SH_HAS_MARKER=0; fi
          if grep -Fq "$PS_MARKER" install.ps1; then PS_HAS_MARKER=1; else PS_HAS_MARKER=0; fi
          case "$SH_HAS_MARKER:$PS_HAS_MARKER" in
            1:1)
              sed -i "s/__PENGUIN_RELEASE_VERSION__/$TAG/g" install.sh
              sed -i "s/__PENGUIN_RELEASE_VERSION__/$TAG/g" install.ps1
              grep -Fq "EMBEDDED_RELEASE_VERSION=\"$TAG\"" install.sh
              grep -Fq "\$EmbeddedReleaseVersion = \"$TAG\"" install.ps1
              ;;
            0:0)
              # Tags created before installer version stamping have neither marker. Preserve their
              # historical installers so a missing Release can still be rebuilt from the tag source.
              echo "Legacy tag without embedded installer versions; leaving installers unstamped."
              ;;
            *)
              echo "Installer release-version markers are inconsistent." >&2
              exit 1
              ;;
          esac
          D="$(date -u +%Y-%m-%d)"
          # BRE: the unescaped | in these patterns is literal (grep/sed default to POSIX BRE, where | is not alternation).
          grep -q 'export const BUILD_DATE: string | null = ' packages/core/src/index.ts
          sed -i "s/export const BUILD_DATE: string | null = [^;]*/export const BUILD_DATE: string | null = \"$D\"/" packages/core/src/index.ts
          # The commit is what separates two builds of the same version, which BUILD_DATE cannot:
          # a release and a same-day rebuild share a date. On manual dispatch GITHUB_SHA
          # belongs to the dispatch branch, so read the actual checkout. The env fallback
          # keeps fixture replays without a Git checkout working.
          SOURCE_SHA="$(git rev-parse HEAD 2>/dev/null || printf '%s' "${GITHUB_SHA:-}")"
          if ! grep -q 'export const BUILD_COMMIT: string | null = ' packages/core/src/index.ts; then
            echo "Legacy tag without a BUILD_COMMIT constant; leaving the commit unstamped."
          elif [ -z "$SOURCE_SHA" ]; then
            echo "GITHUB_SHA is unset; leaving the commit unstamped."
          else
            sed -i "s/export const BUILD_COMMIT: string | null = [^;]*/export const BUILD_COMMIT: string | null = \"$SOURCE_SHA\"/" packages/core/src/index.ts
            grep -Fq "export const BUILD_COMMIT: string | null = \"$SOURCE_SHA\"" packages/core/src/index.ts
          fi

      - name: Build (tsup + vite)
        run: pnpm build

      # The Chrome extension (PenguinHarness Browser), zipped by its own build above. It ships
      # under its versioned name and a version-less copy, so the docs and the Web App's pairing
      # dialog can link to releases/latest/download/penguin-browser-extension.zip, for users who
      # cannot reach the Chrome Web Store listing and load it unpacked; the manifest's pinned key
      # keeps the extension id the same across both. Tags from before the extension have no
      # zip and skip this step, so they stay rebuildable.
      - name: Collect the Chrome extension
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          mkdir -p extension-artifacts
          set -- packages/browser-extension/dist/penguin-browser-extension-*.zip
          if [ ! -f "$1" ]; then
            echo "No Chrome extension in this tag; nothing to collect."
            exit 0
          fi
          cp "$1" "extension-artifacts/penguin-browser-extension-${TAG#v}.zip"
          cp "$1" extension-artifacts/penguin-browser-extension.zip
          unzip -l extension-artifacts/penguin-browser-extension.zip | grep -q ' manifest.json$'

      # lib/: the CLI and its production deps (including workspace core/server/skills, all build outputs);
      # Use pnpm's current deploy implementation with injected workspace packages; the hoisted target layout
      # avoids deeply nested .pnpm/node_modules paths that exceed Windows PowerShell 5.1's legacy MAX_PATH limit.
      # bin/penguin is scripts/launchers/penguin, shipped verbatim — it is the one spelling of
      # the payload layout (lib/dist/penguin.js, web/, an optional node/), and the shape
      # scripts/test-installer.sh pins.
      # lib/plugins/: the builtin plugins (the sandbox backends among them) as the npm prefix
      # the desktop app ships too — the server looks one directory above dist/ for it — so an
      # installed CLI enables this platform's sandbox backend from the Plugins page with no
      # registry, the same as the desktop app. Shipped, not installed: nothing loads until the
      # operator adds it. One prefix serves every payload below (native parts per platform).
      - name: Assemble penguin/ (lib + web + bin + plugins)
        run: |
          pnpm --config.node-linker=hoisted --filter @prismshadow/penguin-cli --prod deploy "$PWD/out/penguin/lib"
          rm -f out/penguin/lib/pnpm-workspace.yaml
          cp -r packages/web/dist out/penguin/web
          install -D -m 755 scripts/launchers/penguin out/penguin/bin/penguin
          node scripts/build-plugins.mjs --out out/penguin/lib/plugins
          test -f out/penguin/lib/plugins/node_modules/@penguinharness/sandbox-bwrap/package.json

      # The plugins that carry their own version ship on the Release as their npm tarballs, which
      # publish-own-plugins later publishes as they are. Packed twice (one set of bytes), at the
      # version their package.json was committed with, and compared with the offline archives the
      # prefix above carries: the Release, npm and every build serve the same file. GitHub only:
      # neither the download manifest nor the OSS mirror lists them.
      - name: Pack the plugins that carry their own version
        run: node scripts/pack-own-plugins.mjs --out plugin-artifacts --offline out/penguin/lib/plugins/offline

      - name: Pack corresponding sources for the bundled native Git
        run: node plugins/agent-state-git/src/pack/stage.mjs --release-sources plugin-artifacts/agent-state-git-sources.tar

      # lib/dist/hmr/: one carried store, generated by the compiled server's own writer.
      # Startup and machine installs consume it without decoding a second image body.
      - name: Pack the install image
        run: |
          node scripts/pack-carried-store.mjs out/penguin/lib/dist/hmr
          test -s out/penguin/lib/dist/hmr/harness.json

      # node-pty compiles its terminal binding when it is installed, for the machine installing
      # it — this runner, linux-x64 — and publishes prebuilds for darwin and win32 only. So the
      # lib/ every payload shares had no binding for linux-arm64, and every terminal on an arm64
      # Linux machine failed with "Failed to load native module: pty.node". Built here once for
      # arm64 under QEMU into prebuilds/linux-arm64, which node-pty's loader tries after
      # build/Release, so one lib/ serves both Linux architectures (N-API: one binding for every
      # Node). Scripts are skipped at install and node-gyp is run by name, against the image's
      # own headers, so neither npm's script policy nor a header download decides the build.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build node-pty for linux-arm64
        run: |
          pty=out/penguin/lib/node_modules/node-pty
          version="$(node -p "require('./$pty/package.json').version")"
          mkdir -p "$pty/prebuilds/linux-arm64"
          docker run --rm --platform linux/arm64 -v "$PWD/$pty/prebuilds/linux-arm64:/out" \
            "node:${NODE_RUNTIME_VERSION#v}-bookworm" sh -c "
              set -e
              cd /tmp && npm init -y >/dev/null
              npm install --ignore-scripts --no-audit --no-fund node-pty@$version
              cd node_modules/node-pty
              node \"\$(npm prefix -g)/lib/node_modules/npm/node_modules/node-gyp/bin/node-gyp.js\" rebuild --nodedir=/usr/local
              cp build/Release/pty.node /out/pty.node"
          file "$pty/prebuilds/linux-arm64/pty.node" | grep -q 'ARM aarch64'

      # Program payloads: linux runtimes use .tar.xz, darwin .tar.gz (nodejs.org naming);
      # node/ is only lightly trimmed (drop share/doc and share/man, keep the rest). Payloads
      # are intermediate files named <target>.tar.gz / win32-x64.zip: the packaging script
      # below seals each one into the canonical installer bundle that gets published.
      - name: Package platform + universal payloads
        run: |
          mkdir -p payloads
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            os="${target%%-*}"
            arch="${target#*-}"
            name="node-$NODE_RUNTIME_VERSION-$os-$arch"
            if [ "$os" = "linux" ]; then ext="tar.xz"; else ext="tar.gz"; fi
            curl -fsSL "https://nodejs.org/dist/$NODE_RUNTIME_VERSION/$name.$ext" -o "/tmp/$name.$ext"
            rm -rf /tmp/node-runtime out/penguin/node
            mkdir -p /tmp/node-runtime
            if [ "$ext" = "tar.xz" ]; then
              tar -xJf "/tmp/$name.$ext" -C /tmp/node-runtime
            else
              tar -xzf "/tmp/$name.$ext" -C /tmp/node-runtime
            fi
            mv "/tmp/node-runtime/$name" out/penguin/node
            rm -rf out/penguin/node/share/doc out/penguin/node/share/man
            printf '{"schemaVersion":1,"target":"%s"}\n' "$os-$arch" > out/penguin/package-manifest.json
            tar -czf "payloads/$os-$arch.tar.gz" -C out penguin
          done
          # Universal payload: no bundled runtime, requires system Node >= 24.
          rm -rf out/penguin/node
          printf '{"schemaVersion":1,"target":"universal"}\n' > out/penguin/package-manifest.json
          tar -czf payloads/universal.tar.gz -C out penguin

      # Windows payload: same lib/ + web/ layout, but a .zip (the native format), the official
      # win-x64 Node runtime — whose zip has node.exe at the ARCHIVE ROOT, not bin/ — and
      # penguin.cmd replacing the sh launcher (see scripts/launchers/penguin.cmd, including why
      # there is deliberately no penguin.ps1).
      #
      # It also bundles MinGit under git\, so exec_command has a POSIX shell even on a machine
      # with no Git for Windows: the shims advertise git\usr\bin\sh.exe as PENGUIN_BUNDLED_SHELL
      # and the resolver (core's shell.ts) uses it only when the user has no bash of their own.
      # MinGit is unpacked with its tree intact — MSYS binaries locate /etc relative to the
      # directory holding msys-2.0.dll, so `sh -lc` finds git\etc\profile and gets the usual
      # /mingw64/bin:/usr/bin:<inherited Windows PATH>, keeping System32's curl/tar reachable.
      - name: Package win-x64 payload
        run: |
          name="node-$NODE_RUNTIME_VERSION-win-x64"
          curl -fsSL "https://nodejs.org/dist/$NODE_RUNTIME_VERSION/$name.zip" -o "/tmp/$name.zip"
          rm -rf /tmp/node-runtime out/penguin/node
          mkdir -p /tmp/node-runtime
          unzip -q "/tmp/$name.zip" -d /tmp/node-runtime
          mv "/tmp/node-runtime/$name" out/penguin/node
          # MinGit unzips flat (no top-level directory), so give it its own destination.
          mingit="MinGit-$MINGIT_VERSION-64-bit.zip"
          curl -fsSL "https://github.com/git-for-windows/git/releases/download/$MINGIT_TAG/$mingit" -o "/tmp/$mingit"
          rm -rf out/penguin/git
          mkdir -p out/penguin/git
          unzip -q "/tmp/$mingit" -d out/penguin/git
          # Fail loudly here rather than shipping a package whose shell silently does not exist.
          test -f out/penguin/git/usr/bin/sh.exe
          test -f out/penguin/git/etc/profile
          printf '{"schemaVersion":1,"target":"win32-x64"}\n' > out/penguin/package-manifest.json
          # The Windows package ships penguin.cmd INSTEAD of the sh launcher: a bare `penguin`
          # on PATH would be picked up by Git Bash and run the wrong thing. The committed file
          # is CRLF (.gitattributes), the only form cmd.exe is fully reliable with.
          rm -f out/penguin/bin/penguin
          install -D -m 644 scripts/launchers/penguin.cmd out/penguin/bin/penguin.cmd
          (cd out && zip -qr ../payloads/win32-x64.zip penguin)

      # The canonical artifacts: each payload is sealed with its checksum and the native
      # installer into one flat bundle per target (see scripts/package-release-bundles.sh).
      - name: Package canonical installer bundles
        run: sh scripts/package-release-bundles.sh payloads dist-artifacts

      # Validate the real release outputs, not only the small fixtures used by the script tests.
      # Every bundle must pass its outer checksum, stay flat with exactly the documented member
      # set, carry a byte-identical installer and payload, and pass its sealed payload checksum.
      - name: Validate canonical installer bundles
        run: |
          set -eu
          ARTIFACT_DIR="$PWD/dist-artifacts"
          PAYLOAD_DIR="$PWD/payloads"
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          validate_layout() {
            dir="$1"
            expected="$2"
            actual="$(find "$dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
            [ -z "$(find "$dir" -mindepth 2 -print -quit)" ]
            [ "$actual" = "$expected" ]
          }

          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 universal; do
            bundle="penguin-$target.tar.gz"
            (cd "$ARTIFACT_DIR" && sha256sum -c "$bundle.sha256")
            extracted="$WORK_DIR/$target"
            mkdir -p "$extracted"
            tar -xzf "$ARTIFACT_DIR/$bundle" -C "$extracted"
            expected="$(printf '%s\n' install.sh payload.tar.gz payload.tar.gz.sha256 | LC_ALL=C sort)"
            validate_layout "$extracted" "$expected"
            [ -x "$extracted/install.sh" ]
            (cd "$extracted" && sha256sum -c payload.tar.gz.sha256)
            cmp "$PWD/install.sh" "$extracted/install.sh"
            cmp "$PAYLOAD_DIR/$target.tar.gz" "$extracted/payload.tar.gz"
          done

          bundle="penguin-win32-x64.zip"
          (cd "$ARTIFACT_DIR" && sha256sum -c "$bundle.sha256")
          extracted="$WORK_DIR/win32-x64"
          mkdir -p "$extracted"
          unzip -q "$ARTIFACT_DIR/$bundle" -d "$extracted"
          expected="$(printf '%s\n' install.cmd install.ps1 payload.zip payload.zip.sha256 | LC_ALL=C sort)"
          validate_layout "$extracted" "$expected"
          (cd "$extracted" && sha256sum -c payload.zip.sha256)
          cmp "$PWD/install.cmd" "$extracted/install.cmd"
          cmp "$PWD/install.ps1" "$extracted/install.ps1"
          cmp "$PAYLOAD_DIR/win32-x64.zip" "$extracted/payload.zip"

      # Summary covers the six canonical bundles.
      - name: Generate SHA256SUMS
        run: |
          cd dist-artifacts
          sha256sum -- *.tar.gz *.zip > SHA256SUMS

      # Desktop artifacts built by the desktop job (three-OS matrix): installers plus the
      # latest*.yml metadata and .blockmap files electron-updater needs. They are collected
      # here so they are part of the Release's initial (immutable) asset set. Their checksums
      # go in a separate SHA256SUMS.desktop, which is also how the OSS mirror script verifies
      # them.
      - name: Collect desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop-artifacts

      - name: Generate desktop checksums
        run: |
          cd desktop-artifacts
          sha256sum -- \
            penguin-desktop-*.AppImage \
            penguin-desktop-*.deb \
            penguin-desktop-*.dmg \
            penguin-desktop-*.zip \
            penguin-desktop-*.exe \
            latest*.yml \
            *.blockmap > SHA256SUMS.desktop

      - name: Generate release probes and download manifest
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node scripts/generate-release-download-manifest.mjs \
            "$TAG" \
            dist-artifacts \
            dist-artifacts \
            desktop-artifacts \
            install.sh \
            install.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: "Unsigned GitCode mirror test ${{ inputs.tag }}"
          body: "Unsigned test artifacts for the GitHub-to-GitCode release mirror rehearsal."
          prerelease: true
          make_latest: false
          files: |
            dist-artifacts/*.tar.gz
            dist-artifacts/*.zip
            dist-artifacts/*.sha256
            dist-artifacts/SHA256SUMS
            dist-artifacts/probe-*.bin
            dist-artifacts/release-download-manifest.tsv
            desktop-artifacts/penguin-desktop-*.AppImage
            desktop-artifacts/penguin-desktop-*.deb
            desktop-artifacts/penguin-desktop-*.dmg
            desktop-artifacts/penguin-desktop-*.zip
            desktop-artifacts/penguin-desktop-*.exe
            desktop-artifacts/latest*.yml
            desktop-artifacts/*.blockmap
            desktop-artifacts/SHA256SUMS.desktop
            extension-artifacts/*.zip
            plugin-artifacts/*.tgz
            plugin-artifacts/agent-state-git-sources.tar
            install.sh
            install.ps1

  plan-gitcode-mirror:
    name: Plan GitCode mirror batches
    needs: [check-release, release]
    if: >-
      ${{ !cancelled() && inputs.sync_gitcode && needs.check-release.result == 'success' &&
          (needs.release.result == 'success' ||
           (needs.release.result == 'skipped' && needs.check-release.outputs.exists == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Partition the release without exceeding runner limits
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$PENGUIN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > release.json
          batches="$(node scripts/mirror-release-to-gitcode.mjs release.json release-assets plan)"
          echo "batches=$batches" >> "$GITHUB_OUTPUT"

  mirror-gitcode:
    name: Upload GitCode batch ${{ matrix.batch }} (one file at a time)
    needs: [plan-gitcode-mirror]
    if: ${{ !cancelled() && needs.plan-gitcode-mirror.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: ${{ fromJSON(needs.plan-gitcode-mirror.outputs.batches) }}
    concurrency:
      group: gitcode-release-test
      cancel-in-progress: false
    permissions:
      contents: read
    environment: gitcode-release-test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download exact GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ matrix.batch }}
        run: |
          gh release view "$PENGUIN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,body,isDraft,isPrerelease,assets > release.json
          node scripts/mirror-release-to-gitcode.mjs release.json release-assets list "$BATCH" > assets.txt
          options=()
          while IFS= read -r file; do options+=(--pattern "$file"); done < assets.txt
          if (( ${#options[@]} )); then
            gh release download "$PENGUIN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --dir release-assets "${options[@]}"
          fi

      - name: Upload and verify GitCode Release assets
        env:
          BATCH: ${{ matrix.batch }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: node scripts/mirror-release-to-gitcode.mjs release.json release-assets upload "$BATCH"

  verify-gitcode-mirror:
    name: Verify all GitCode Release attachments
    needs: [mirror-gitcode]
    if: ${{ !cancelled() && needs.mirror-gitcode.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
    environment: gitcode-release-test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Compare the attachment set and public download
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          gh release view "$PENGUIN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > release.json
          node scripts/mirror-release-to-gitcode.mjs release.json release-assets verify
